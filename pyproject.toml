[project]
name = "cell2mol"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ase>=3.26.0",
    "networkx>=3.5",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "pydantic>=2.12.2",
    "pyyaml>=6.0.3",
    "rdkit>=2025.9.1",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.ruff]
fix = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"