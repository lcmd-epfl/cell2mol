[project]
name = "cell2mol"
version = "2.0.0"
description = "Encoding chemistry to interpret crystallographic data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ase>=3.26.0",
    "networkx>=3.2.1",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "pydantic>=2.12.2",
    "pydantic-numpy>=6.0.0",
    "pyyaml>=6.0.3",
    "rdkit>=2025.9.1",
    "scikit-learn>=1.6.1",
    "scipy>=1.13.1",
]

[dependency-groups]
test = [
    "pytest>=7.0",
]
dev = [
    "ipython>=8.18.0,<9.0.0",
    "pre-commit>=4.0.0",
    "ruff>=0.14.0",
    { include-group = "test" },
]

[tool.ruff]
fix = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
